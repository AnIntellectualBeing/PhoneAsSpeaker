name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach the APK to a GitHub Release on tags

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests + debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Name the APK
        id: apk
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then VERSION="$GITHUB_REF_NAME"; else VERSION="${GITHUB_SHA::7}"; fi
          NAME="SyncSpeaker-${VERSION}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: SyncSpeaker-debug-apk
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: app/build/reports/tests/

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.name }}
          generate_release_notes: true

  web:
    name: Web listener + PC host server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Syntax check
        run: |
          for f in server/*.js server/test/*.js web/listener/syncspeaker.js web/pc-host/*.js; do node --check "$f"; done

      - name: Protocol + sync tests (Node, no dependencies)
        run: node server/test/run-tests.js

      - name: Install Playwright + Chromium (test only)
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium

      # Timing tests on shared CI machines can hit a CPU hiccup, so each gets one retry.
      - name: Browser sync tests (headless Chromium, 3 listeners each)
        run: |
          t() { node server/test/browser-test.js "$@" || { echo "::warning::retrying browser-test $*"; node server/test/browser-test.js "$@"; }; }
          t
          t --pc-host
          t --pc-host --real-capture
          t --jitter 60
